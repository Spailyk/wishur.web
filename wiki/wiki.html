<!DOCTYPE html>
<html lang="ru" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вики — Wishur</title>
  <link rel="icon" type="image/png" href="../assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&family=Unbounded:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/wiki.css">
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script>
    if (localStorage.getItem('theme') === 'light') document.documentElement.classList.add('light');
  </script>
</head>
<body class="bg-grid">

  <!-- PRELOADER -->
  <div id="wikiPreloader" class="wiki-preloader">
    <div class="preloader-inner">
      <div class="preloader-logo"><img src="../assets/logo.png" alt="Wishur"></div>
      <div class="preloader-title font-heading">WISHUR <span class="accent">WIKI</span></div>
      <div class="preloader-bar"><span></span></div>
      <div class="preloader-sub">Загрузка базы знаний…</div>
    </div>
  </div>

  <div class="orb-bg">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>

  <!-- Header -->
  <header class="site-header">
    <div class="header-inner">
      <a href="../index.html" class="brand">
        <div class="brand-logo"><img src="../assets/logo.png" alt="Wishur"></div>
        <span class="brand-name font-heading">WISHUR</span>
        <span class="brand-tag font-heading">Wiki</span>
      </a>

      <div class="header-actions">
        <a href="../index.html" class="header-btn">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span class="btn-label">На главную</span>
        </a>
        <button id="themeToggle" class="header-btn icon-only" aria-label="Сменить тему">
          <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <div class="wiki-layout">
    <!-- Sidebar -->
    <aside class="glass-panel wiki-sidebar">
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="wikiSearch" class="search-input" type="text" placeholder="Поиск по статьям..." autocomplete="off">
        <div id="searchResults" class="search-results"></div>
      </div>

      <div class="section-label">Дерево статей</div>
      <div id="treeRoot"></div>
    </aside>

    <!-- Content -->
    <main class="glass-panel article-panel">
      <div id="breadcrumbs" class="breadcrumbs"></div>
      <div id="articleContent">
        <div class="welcome-card">
          <div class="welcome-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
          </div>
          <h1 class="font-heading">Добро пожаловать в Wiki Wishur</h1>
          <p>Выберите статью слева или воспользуйтесь поиском.</p>
        </div>
      </div>
    </main>
  </div>

  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <span class="font-heading">Wishur Wiki</span>
        <span class="version-badge">26.2-26.4</span>
      </div>
      <p>©Wishur 2026. Wiki.</p>
      <div class="footer-links">
        <a href="../index.html">Главная</a>
        <a href="../index.html#rules">Правила</a>
      </div>
    </div>
  </footer>

  <script src="data/seed.js"></script>
  <script src="js/store.js"></script>
  <script src="js/wiki.js"></script>
</body>
</html>
